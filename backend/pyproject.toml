[project]
name = "wms-backend"
version = "0.1.0"
description = "Warehouse Management System (WMS) Backend API"
readme = "README.md"
authors = [
    { name = "nmnguyenn130", email = "nguyenminhnguyen1324@gmail.com" }
]
requires-python = ">=3.13,<3.14"
dependencies = [
    "alembic>=1.20.1",
    "asyncpg==0.32.0",
    "bcrypt==5.0.0",
    "email-validator>=2.3.0",
    "fastapi==0.162.0",
    "limits==5.8.0",
    "pydantic==2.14.3",
    "pydantic-settings==2.16.2",
    "pyjwt==2.15.1",
    "sqlalchemy[asyncio]==2.1.8",
    "uvicorn[standard]==0.54.0",
]

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "pytest==9.2.0",
    "pytest-asyncio==1.4.1.post1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
